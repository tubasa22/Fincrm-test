<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinCRM 시스템</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <header class="bg-blue-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-shield-halved text-2xl text-amber-400"></i>
        <h1 class="text-xl font-bold tracking-tight">FinCRM Protection</h1>
      </div>
      <div id="auth-area" class="flex items-center space-x-2">
        <span id="conn-status" class="bg-slate-500 text-white text-xs font-medium px-3 py-1 rounded-full">연결 대기 중</span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6">
    <div class="flex border-b border-slate-200 mb-6 space-x-2 overflow-x-auto">
      <button onclick="switchTab('dashboard')" id="btn-dashboard" class="tab-btn px-4 py-2.5 font-medium text-sm text-blue-600 border-b-2 border-blue-600 transition flex items-center space-x-2">
        <i class="fa-solid fa-chart-pie"></i><span>📊 대시보드</span>
      </button>
      <button onclick="switchTab('clients')" id="btn-clients" class="tab-btn px-4 py-2.5 font-medium text-sm text-slate-500 hover:text-slate-700 border-b-2 border-transparent transition flex items-center space-x-2">
        <i class="fa-solid fa-users"></i><span>👥 고객 목록</span>
      </button>
    </div>

    <div id="tab-dashboard" class="tab-content active space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
          <div>
            <p class="text-xs font-medium text-slate-400 uppercase">전체 관리 고객</p>
            <h3 id="stat-total" class="text-2xl font-bold text-slate-700 mt-1">0명</h3>
          </div>
          <div class="p-3 rounded-lg bg-blue-50 text-blue-600"><i class="fa-solid fa-users text-xl"></i></div>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
          <div>
            <p class="text-xs font-medium text-slate-400 uppercase">이번 달 생일자</p>
            <h3 id="stat-birthday" class="text-2xl font-bold text-emerald-600 mt-1">0명</h3>
          </div>
          <div class="p-3 rounded-lg bg-emerald-50 text-emerald-600"><i class="fa-solid fa-cake-candles text-xl"></i></div>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
          <div>
            <p class="text-xs font-medium text-slate-400 uppercase">연락 필요 (D-Day)</p>
            <h3 id="stat-dday" class="text-2xl font-bold text-amber-600 mt-1">0명</h3>
          </div>
          <div class="p-3 rounded-lg bg-amber-50 text-amber-600"><i class="fa-solid fa-clock text-xl"></i></div>
        </div>
      </div>
      
      <div class="bg-white p-6 rounded-xl border border-slate-200 space-y-3">
        <p class="text-sm font-medium text-slate-600">🔗 구글 웹 앱 API 연동 주소 설정</p>
        <div class="flex gap-2">
          <input type="text" id="api-url-input" placeholder="https://script.google.com/macros/s/.../exec" class="flex-1 bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
          <button onclick="saveApiUrl()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition">연결 저장</button>
        </div>
        <p class="text-xs text-slate-400">최초 1회 설정하면 브라우저에 안전하게 저장됩니다.</p>
      </div>
    </div>

    <div id="tab-clients" class="tab-content space-y-4">
      <div class="flex justify-between items-center flex-wrap gap-2">
        <div class="relative w-full sm:w-72">
          <input type="text" id="search-input" oninput="filterClients()" placeholder="고객명 또는 연락처 검색..." class="w-full bg-white border border-slate-200 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-blue-500">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[800px]">
          <thead>
            <tr class="bg-slate-50 text-slate-500 text-xs font-semibold uppercase border-b border-slate-100">
              <th class="p-4 w-16 text-center">No</th>
              <th class="p-4">고객명</th>
              <th class="p-4">연락처</th>
              <th class="p-4">이메일</th>
              <th class="p-4">플랜구분</th>
              <th class="p-4">가입상품</th>
              <th class="p-4">다음 연락일</th>
            </tr>
          </thead>
          <tbody id="client-table-body" class="text-sm divide-y divide-slate-50 text-slate-600">
            <tr>
              <td colspan="7" class="p-8 text-center text-slate-400">API 연결을 완료한 후 데이터를 불러옵니다.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let allClients = [];
    let GAS_API_URL = localStorage.getItem('gas_api_url') || '';

    window.onload = function() {
      if (GAS_API_URL) {
        document.getElementById('api-url-input').value = GAS_API_URL;
        updateStatus(true);
        loadClientsData();
      }
    };

    function saveApiUrl() {
      const url = document.getElementById('api-url-input').value.trim();
      if (!url.startsWith('https://script.google.com')) {
        alert('올바른 구글 웹 앱 URL 형식이 아닙니다.');
        return;
      }
      localStorage.setItem('gas_api_url', url);
      GAS_API_URL = url;
      alert('API 주소가 성공적으로 저장되었습니다!');
      updateStatus(true);
      loadClientsData();
    }

    function updateStatus(isConnected) {
      const statusEl = document.getElementById('conn-status');
      if (isConnected) {
        statusEl.className = "bg-emerald-600 text-white text-xs font-medium px-3 py-1 rounded-full";
        statusEl.innerHTML = '<i class="fa-solid fa-link"></i> 구글 시트 연결됨';
      } else {
        statusEl.className = "bg-amber-500 text-slate-900 text-xs font-medium px-3 py-1 rounded-full";
        statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> API 주소 미설정';
      }
    }

    // 🌐 github.io 에서 구글 API 호출 (Fetch 방식)
    function loadClientsData() {
      if (!GAS_API_URL) return;
      
      const tbody = document.getElementById('client-table-body');
      tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-500"><i class="fa-solid fa-spinner animate-spin"></i> 실시간 동기화 중...</td></tr>`;

      fetch(`${GAS_API_URL}?action=getClients`)
        .then(res => res.json())
        .then(response => {
          if (response.clients) {
            allClients = response.clients;
            renderTable(allClients);
            updateDashboard(allClients);
          } else if (response.error) {
            alert('데이터 로드 실패: ' + response.error);
          }
        })
        .catch(err => {
          console.error(err);
          alert('구글 API 서버 통신 실패. 웹 앱 배포 설정(모든 사용자 액세스 가능)을 확인해 주세요.');
        });
    }

    function renderTable(data) {
      const tbody = document.getElementById('client-table-body');
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400">등록된 고객 데이터가 없습니다.</td></tr>`;
        return;
      }
      tbody.innerHTML = data.map(c => `
        <tr class="hover:bg-slate-50/80 transition">
          <td class="p-4 text-center font-medium text-slate-400">${c.no}</td>
          <td class="p-4 font-semibold text-slate-700">${c.name}</td>
          <td class="p-4 text-slate-500">${c.phone}</td>
          <td class="p-4 text-slate-500">${c.email}</td>
          <td class="p-4"><span class="px-2 py-0.5 rounded text-xs font-medium bg-blue-50 text-blue-700 border border-blue-100">${c.plan}</span></td>
          <td class="p-4 text-slate-600">${c.prod}</td>
          <td class="p-4 font-medium text-slate-600">${c.next || '-'}</td>
        </tr>
      `).join('');
    }

    function updateDashboard(data) {
      document.getElementById('stat-total').innerText = data.length + '명';
      document.getElementById('stat-birthday').innerText = '0명'; 
      document.getElementById('stat-dday').innerText = data.filter(c => c.next).length + '건';
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => {
        el.classList.remove('text-blue-600', 'border-blue-600');
        el.classList.add('text-slate-500', 'border-transparent');
      });
      document.getElementById('tab-' + tabId).classList.add('active');
      const activeBtn = document.getElementById('btn-' + tabId);
      activeBtn.classList.remove('text-slate-500', 'border-transparent');
      activeBtn.classList.add('text-blue-600', 'border-blue-600');
    }

    function filterClients() {
      const term = document.getElementById('search-input').value.toLowerCase();
      const filtered = allClients.filter(c => 
        c.name.toLowerCase().includes(term) || c.phone.includes(term)
      );
      renderTable(filtered);
    }
  </script>
</body>
</html>
